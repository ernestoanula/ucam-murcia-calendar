name: Actualizar calendario UCAM Murcia

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar calendario
        run: python update_calendar.py

      - name: Guardar calendario actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ucam-murcia-basket.ics
          git diff --cached --quiet || git commit -m "Actualizar calendario UCAM Murcia"
          git push
